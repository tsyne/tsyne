# NOTE: BUILDKITE_GIT_CLEAN_FLAGS="-ffd" is set in the agent's environment hook
# (/buildkite/hooks/environment) to preserve gitignored build artifacts
# (bin/tsyne-bridge, node_modules, dist/) between pipeline steps.
# It CANNOT be set here — Buildkite treats it as a protected variable.

steps:
  - label: ":broom: Cleanup"
    command: "./ci.sh cleanup"
    agents:
      queue: "default-queue"
    timeout_in_minutes: 1

  - label: ":golang: Bridge"
    command: "./ci.sh bridge"
    agents:
      queue: "default-queue"
    timeout_in_minutes: 10
    artifact_paths:
      - "core/bin/tsyne-bridge"
      - "core/bin/libtsyne.*"

  - label: ":nodejs: Core"
    command: "./ci.sh core"
    agents:
      queue: "default-queue"
    timeout_in_minutes: 12

  - label: ":art: Cosyne"
    command: "./ci.sh cosyne"
    agents:
      queue: "default-queue"
    timeout_in_minutes: 5

  - label: ":three: Trine"
    command: "./ci.sh trine"
    agents:
      queue: "default-queue"
    timeout_in_minutes: 5

  - label: ":art: Designer"
    command: "./ci.sh designer"
    agents:
      queue: "default-queue"
    timeout_in_minutes: 5

  - label: ":bulb: Examples"
    command: "./ci.sh examples"
    agents:
      queue: "default-queue"
    timeout_in_minutes: 5

  - label: ":package: Ported Apps"
    command: "./ci.sh ported-apps"
    agents:
      queue: "default-queue"
    timeout_in_minutes: 15

  - label: ":iphone: Phone Apps"
    command: "./ci.sh phone-apps"
    agents:
      queue: "default-queue"
    timeout_in_minutes: 15

  - label: ":computer: Launchers"
    command: "./ci.sh launchers"
    agents:
      queue: "default-queue"
    timeout_in_minutes: 5

  - label: ":rocket: Larger Apps"
    command: "./ci.sh larger-apps"
    agents:
      queue: "default-queue"
    timeout_in_minutes: 5

  - label: ":test_tube: Test Apps"
    command: "./ci.sh test-apps"
    agents:
      queue: "default-queue"
    timeout_in_minutes: 5

  - label: ":android: Android"
    command: "./ci.sh android"
    agents:
      queue: "default-queue"
    timeout_in_minutes: 10
    soft_fail: true

  - label: ":bar_chart: Summary"
    command: "./ci.sh summary"
    agents:
      queue: "default-queue"
    timeout_in_minutes: 1
