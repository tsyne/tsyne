<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Test: gradientUnits="userSpaceOnUse" -->
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F00"/>
      <stop offset="1" stop-color="#00F"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F00"/>
      <stop offset="1" stop-color="#00F"/>
    </linearGradient>
  </defs>
  <!-- Top: userSpaceOnUse, Bottom: objectBoundingBox (default) — should look the same -->
  <rect x="10" y="10" width="80" height="35" fill="url(#g1)"/>
  <rect x="10" y="55" width="80" height="35" fill="url(#g2)"/>
</svg>
