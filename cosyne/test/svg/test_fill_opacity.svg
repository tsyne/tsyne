<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Test: fill-opacity in style attribute -->
  <!-- Left: full opacity red, Right: 50% opacity red over blue -->
  <rect x="0" y="0" width="100" height="100" fill="#00F"/>
  <rect x="10" y="10" width="35" height="80" style="fill:#F00;fill-opacity:1"/>
  <rect x="55" y="10" width="35" height="80" style="fill:#F00;fill-opacity:0.5"/>
</svg>
