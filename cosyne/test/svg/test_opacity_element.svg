<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Test: element-level opacity attribute and style opacity -->
  <rect x="0" y="0" width="100" height="100" fill="#FFF"/>
  <rect x="10" y="10" width="80" height="35" fill="#F00" opacity="0.5"/>
  <rect x="10" y="55" width="80" height="35" style="fill:#00F;opacity:0.5"/>
</svg>
